
<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Booster - Trading</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #131b2e;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #4cd137;
            font-size: 18px;
        }
        .card-solde {
            background: #1c263d;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .solde-info span {
            display: block;
            font-size: 11px;
            color: #8899a6;
        }
        .solde-info strong {
            font-size: 16px;
            color: #fff;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #a0aec0;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1c263d;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .timeframe-container {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .tf-btn {
            flex: 1;
            padding: 6px 2px;
            background: #1c263d;
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #8899a6;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .tf-btn.active {
            background: #0072ff;
            color: #fff;
            border-color: #00c6ff;
        }
        .btn-debut {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: opacity 0.3s;
        }
        .btn-debut:hover {
            opacity: 0.9;
        }
        .btn-strategie {
            width: 100%;
            padding: 10px;
            background: #2d3748;
            color: #a0aec0;
            border: 1px solid #4a5568;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .btn-strategie.active-strat {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Booster Robot</h2>

        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <div class="card-solde" style="flex: 1; margin-bottom: 0;">
                <div class="solde-info">
                    <span>Solde Démo</span>
                    <strong id="solde-demo">Chargement...</strong>
                </div>
            </div>
            <div class="card-solde" style="flex: 1; margin-bottom: 0;">
                <div class="solde-info">
                    <span>Solde Réel</span>
                    <strong id="solde-reel">0 USDT</strong>
                </div>
            </div>
        </div>

        <button type="button" id="btn-toggle-strategie" class="btn-strategie">Activer la Stratégie Auto (En chaîne)</button>

        <div style="background: #1c263d; border-radius: 12px; padding: 10px; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <select id="actif" style="width: 55%; padding: 6px; font-size: 13px;">
                    <option value="BTC/USDT">Bitcoin (BTC/USDT)</option>
                    <option value="ETH/USDT">Ethereum (ETH/USDT)</option>
                    <option value="SOL/USDT">Solana (SOL/USDT)</option>
                    <option value="XLM/USDT">Stellar (XLM/USDT)</option>
                </select>
                <span id="prix-actuel" style="font-size: 13px; color: #4ade80; font-weight: bold;">-- USDT</span>
            </div>

            <div class="timeframe-container">
                <button type="button" class="tf-btn" data-tf="5s" data-sec="5">5s</button>
                <button type="button" class="tf-btn" data-tf="30s" data-sec="30">30s</button>
                <button type="button" class="tf-btn active" data-tf="1m" data-sec="60">1m</button>
                <button type="button" class="tf-btn" data-tf="5m" data-sec="300">5m</button>
                <button type="button" class="tf-btn" data-tf="1h" data-sec="3600">1h</button>
            </div>

            <div style="position: relative; height: 180px; width: 100%;">
                <canvas id="graphiquePrix"></canvas>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="type-compte">Compte</label>
                <select id="type-compte">
                    <option value="DEMO">Démo</option>
                    <option value="REEL">Réel</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="type-option">Option</label>
                <select id="type-option">
                    <option value="CALL">Hausse (Call)</option>
                    <option value="PUT">Baisse (Put)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="montant">Montant de départ ($5 auto)</label>
            <input type="number" id="montant" value="10">
        </div>

        <button type="button" class="btn-debut" id="btn-executer">DÉBUT (<span id="label-expiration">1m</span>)</button>

        <div class="table-container" style="margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;">
            <h3 style="color: #fff; font-size: 14px; margin-bottom: 8px; margin-top: 0;">Historique des Trades</h3>
            <table style="width: 100%; color: #fff; text-align: left; font-size: 11px; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                        <th style="padding: 6px;">Heure</th>
                        <th style="padding: 6px;">Actif</th>
                        <th style="padding: 6px;">Type</th>
                        <th style="padding: 6px;">Montant</th>
                        <th style="padding: 6px;">Statut</th>
                    </tr>
                </thead>
                <tbody id="historique-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let monGraphique = null;
        let timeframeActuel = '1m';
        let dureeSecondes = 60;
        let tradeActifEnCours = null;
        let strategieActive = false;
        let timeoutStrategie = null;

        const btnToggleStrat = document.getElementById('btn-toggle-strategie');
        const inputMontant = document.getElementById('montant');
        const selectOption = document.getElementById('type-option');
        const btnExec = document.getElementById('btn-executer');

        btnToggleStrat.addEventListener('click', () => {
            strategieActive = !strategieActive;
            if (strategieActive) {
                btnToggleStrat.classList.add('active-strat');
                btnToggleStrat.textContent = "Arrêter la Stratégie Auto (ON)";
                inputMontant.value = 5;
                inputMontant.disabled = true;
                lancerProchainCycle();
            } else {
                btnToggleStrat.classList.remove('active-strat');
                btnToggleStrat.textContent = "Activer la Stratégie Auto (En chaîne)";
                inputMontant.disabled = false;
                if (timeoutStrategie) {
                    clearTimeout(timeoutStrategie);
                    timeoutStrategie = null;
                }
                btnExec.disabled = false;
                btnExec.innerHTML = `DÉBUT (<span id="label-expiration">${timeframeActuel}</span>)`;
            }
        });

        const pointBrillantEtLignePlugin = {
            id: 'pointBrillantEtLigne',
            afterDraw(chart) {
                const dataset = chart.data.datasets[0];
                if (!dataset || !dataset.data || dataset.data.length === 0) return;

                const meta = chart.getDatasetMeta(0);
                const dernierPointIndex = dataset.data.length - 1;
                const point = meta.data[dernierPointIndex];
                if (!point) return;

                const ctx = chart.ctx;
                const xPixel = point.x;
                const yPixel = point.y;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;
                const dernierPrix = dataset.data[dernierPointIndex];

                ctx.save();

                if (tradeActifEnCours) {
                    const yPointTrade = yAxis.getPixelForValue(tradeActifEnCours.prixDepart);
                    if (!isNaN(yPointTrade)) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = tradeActifEnCours.couleur;
                        ctx.fillStyle = tradeActifEnCours.couleur;
                        ctx.beginPath();
                        ctx.arc(xPixel, yPointTrade, 6, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }

                const textePrix = dernierPrix.toFixed(2);
                ctx.font = '10px sans-serif';
                const largeurTexte = ctx.measureText(textePrix).width;
                const largeurEtiquette = largeurTexte + 16;
                const xEtiquette = xPixel + 12;

                ctx.beginPath();
                ctx.setLineDash([4, 4]);
                ctx.moveTo(xAxis.left, yPixel);
                ctx.lineTo(xAxis.right, yPixel);
                ctx.strokeStyle = '#00c6ff';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00c6ff';
                ctx.fillStyle = '#00c6ff';
                ctx.beginPath();
                ctx.arc(xPixel, yPixel, 5, 0, 2 * Math.PI);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(xPixel, yPixel, 2, 0, 2 * Math.PI);
                ctx.fill();

                const yEtiquette = yPixel - 9;
                ctx.fillStyle = '#0072ff';
                ctx.fillRect(xEtiquette, yEtiquette, largeurEtiquette, 18);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(textePrix, xEtiquette + 8, yPixel + 3);

                ctx.restore();
            }
        };

        function initialiserGraphique() {
            const ctx = document.getElementById('graphiquePrix').getContext('2d');
            monGraphique = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Prix',
                        data: [],
                        borderColor: '#00c6ff',
                        backgroundColor: 'rgba(0, 198, 255, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    layout: { padding: { right: 85 } },
                    scales: {
                        x: { display: false },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#8899a6', font: { size: 10 } }
                        }
                    }
                },
                plugins: [pointBrillantEtLignePlugin]
            });
        }

        function actualiserSoldes() {
            fetch('/api/trading/solde')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('solde-demo').textContent = `${data.solde_demo.toLocaleString()} ${data.devise}`;
                    if (data.solde_reel !== undefined) {
                        document.getElementById('solde-reel').textContent = `${data.solde_reel.toLocaleString()} ${data.devise}`;
                    }
                })
                .catch(err => console.error("Erreur soldes :", err));
        }

        function chargerBougies(actif, tf) {
            const symbol = actif.replace(' OTC', '');
            fetch(`/api/trading/bougies?symbol=${symbol}&timeframe=${tf}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.bougies.length > 0) {
                        const labels = data.bougies.map(b => new Date(b.temps).toLocaleTimeString());
                        const prix = data.bougies.map(b => b.cloture);

                        monGraphique.data.labels = labels;
                        monGraphique.data.datasets[0].data = prix;
                        monGraphique.update();

                        const dernierPrix = prix[prix.length - 1];
                        document.getElementById('prix-actuel').textContent = `${dernierPrix} USDT`;
                    }
                })
                .catch(err => console.error("Erreur bougies :", err));
        }

        function chargerHistoriqueLocalStorage() {
            const historique = JSON.parse(localStorage.getItem('ai_baalo_historique')) || [];
            const tbody = document.getElementById('historique-table-body');
            tbody.innerHTML = '';

            historique.slice(0, 10).forEach(item => {
                const newRow = document.createElement('tr');
                const colorStyle = item.typeOption === 'CALL' ? 'color: #4ade80;' : 'color: #f87171;';
                const heureTrade = item.heure || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                newRow.innerHTML = `
                    <td style="padding: 6px; color: #8899a6;">${heureTrade}</td>
                    <td style="padding: 6px;">${item.actif} (${item.timeframe})</td>
                    <td style="padding: 6px; ${colorStyle} font-weight: bold;">${item.typeOption}</td>
                    <td style="padding: 6px;">${item.montant}</td>
                    <td style="padding: 6px; ${item.resultatCouleur} font-weight: bold;">${item.resultatTexte}</td>
                `;
                tbody.appendChild(newRow);
            });
        }

        function sauvegarderEtAfficherTrade(tradeData) {
            let historique = JSON.parse(localStorage.getItem('ai_baalo_historique')) || [];
            historique.unshift(tradeData);
            localStorage.setItem('ai_baalo_historique', JSON.stringify(historique));
            chargerHistoriqueLocalStorage();
        }

        initialiserGraphique();
        actualiserSoldes();
        chargerHistoriqueLocalStorage();
        const actifInitial = document.getElementById('actif').value;
        chargerBougies(actifInitial, timeframeActuel);
        setInterval(() => {
            const actifActuel = document.getElementById('actif').value;
            chargerBougies(actifActuel, timeframeActuel);
            actualiserSoldes();
        }, 5000);

        function executerUnCycleDeTrade() {
            if (!strategieActive) return;

            const actif = document.getElementById('actif').value;
            const montantManuel = document.getElementById('montant').value;
            const typeOptionManuel = document.getElementById('type-option').value;
            const typeCompte = document.getElementById('type-compte').value;

            const dataset = monGraphique.data.datasets[0].data;
            if (!dataset || dataset.length === 0) return;

            const prixDepart = dataset[dataset.length - 1];
            btnExec.disabled = true;

            fetch('/api/trading/executer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    actif,
                    montant: montantManuel,
                    type_option: typeOptionManuel,
                    type_compte: typeCompte,
                    timeframe: timeframeActuel,
                    strategie_active: true,
                    phase: 'DEBUT'
                })
            })
            .then(res => res.json())
            .then(dataInit => {
                const directionJouee = dataInit.type_option_utilise;
                const montantJoue = dataInit.montant_utilise;

                inputMontant.value = montantJoue;
                selectOption.value = directionJouee;

                const couleurPoint = directionJouee === 'CALL' ? '#4ade80' : '#f87171';
                tradeActifEnCours = { prixDepart, couleur: couleurPoint };

                let tempsRestant = dureeSecondes;
                const intervalCompteARebours = setInterval(() => {
                    if (!strategieActive) {
                        clearInterval(intervalCompteARebours);
                        return;
                    }
                    btnExec.innerHTML = `Auto (${directionJouee} - $${montantJoue}) : ${tempsRestant}s`;
                    tempsRestant--;

                    if (tempsRestant < 0) {
                        clearInterval(intervalCompteARebours);
                        tradeActifEnCours = null;

                        const datasetActuel = monGraphique.data.datasets[0].data;
                        const prixArrivee = datasetActuel && datasetActuel.length > 0 ? datasetActuel[datasetActuel.length - 1] : prixDepart;

                        let resultatTexte = "Perdu";
                        let resultatCouleur = "color: #f87171;";

                        if (directionJouee === 'CALL' && prixArrivee > prixDepart) {
                            resultatTexte = "Gain";
                            resultatCouleur = "color: #4ade80;";
                        } else if (directionJouee === 'PUT' && prixArrivee < prixDepart) {
                            resultatTexte = "Gain";
                            resultatCouleur = "color: #4ade80;";
                        }

                        const heureActuelle = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                        // Affichage d'une pause d'analyse de 2.5 secondes
                        btnExec.innerHTML = `Analyse du gain...`;

                        fetch('/api/trading/executer', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                actif,
                                montant: montantJoue,
                                type_option: directionJouee,
                                type_compte: typeCompte,
                                timeframe: timeframeActuel,
                                strategie_active: true,
                                phase: 'FIN',
                                resultat: resultatTexte
                            })
                        })
                        .then(res => res.json())
                        .then(dataFin => {
                            if (dataFin.nouveau_solde_demo !== undefined) {
                                document.getElementById('solde-demo').textContent = `${dataFin.nouveau_solde_demo.toLocaleString()} USDT`;
                            } else {
                                actualiserSoldes();
                            }

                            if (dataFin.prochaine_mise !== undefined) {
                                inputMontant.value = dataFin.prochaine_mise;
                                selectOption.value = dataFin.prochaine_direction;
                            }

                            sauvegarderEtAfficherTrade({
                                heure: heureActuelle,
                                actif,
                                timefame: timeframeActuel,
                                typeOption: directionJouee,
                                montant: montantJoue,
                                resultatTexte,
                                resultatCouleur
                            });

                            // LAISSER 2.5 SECONDES DE PAUSE AVANT DE RELANCER LE PROCHAIN CYCLE
                            if (strategieActive) {
                                timeoutStrategie = setTimeout(() => {
                                    lancerProchainCycle();
                                }, 2500);
                            }
                        })
                        .catch(err => {
                            console.error("Erreur fin de cycle:", err);
                            if (strategieActive) {
                                timeoutStrategie = setTimeout(lancerProchainCycle, 2500);
                            }
                        });
                    }
                }, 1000);
            })
            .catch(err => {
                console.error("Erreur début cycle:", err);
                if (strategieActive) {
                    timeoutStrategie = setTimeout(lancerProchainCycle, 2500);
                }
            });
        }

        function lancerProchainCycle() {
            if (strategieActive) {
                executerUnCycleDeTrade();
            }
        }
    </script>
</body>
</html>
